services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: production.env
    environment:
      APP_ENV: production
      TRACKING_REQUIRE_VERIFICATION: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - catalogue:/app/backend/data
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: production.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  catalogue:
  caddy_data:
  caddy_config:
